<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toss for any decision!</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: #f5f5f5;
        }
        
        .header {
            position: relative;
            margin-bottom: 2rem;
        }
        
        .home-icon {
            width: 30px;
            position: absolute;
            left: 0;
            top: 0;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .home-icon:hover {
            transform: scale(1.1);
        }
        
        h1 {
            font-size: clamp(1.8rem, 5vw, 2.5rem);
            margin: 1rem 0;
            color: #333;
        }
        
        marquee {
            margin: 1rem 0;
            font-size: clamp(1rem, 3vw, 1.2rem);
        }
        
        .container {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        #toss-button {
            padding: 1rem 2rem;
            font-size: clamp(1.2rem, 4vw, 1.5rem);
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
            max-width: 300px;
            margin: 1rem 0;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        #toss-button:hover {
            background-color: #45a049;
            transform: translateY(-2px);
        }
        
        #toss-button:active {
            transform: translateY(1px);
        }
        
        #toss-button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
            transform: none;
        }
        
        #coin-container {
            width: 100%;
            display: flex;
            justify-content: center;
            margin: 1.5rem 0;
        }
        
        #coin {
            width: clamp(120px, 30vw, 150px);
            height: clamp(120px, 30vw, 150px);
            display: none;
            object-fit: contain;
        }
        
        #result {
            font-size: clamp(1.2rem, 4vw, 1.5rem);
            font-weight: bold;
            margin: 1rem 0;
            min-height: 2rem;
            color: #333;
        }

        
        @media (max-width: 600px) {
            #toss-button {
                padding: 1.5rem 2rem;
                font-size: 1.5rem;
                max-width: 100%;
            }
            
            .home-icon {
                width: 40px;
            }
        }
        body.dark-mode {
  background: #222;
  color: white;
}
    </style>
</head>
<body>
<center>

  </center>
    <div class="header">
        <img src="home.png" class="home-icon" alt="Home">
        <h1>Us Toss™</h1>
        <marquee><h3>Thank you for visiting Us Toss</h3></marquee>
    </div>

<div style="text-align: center; margin-bottom: 20px;">
  <a href="aboutus.html" 
     style="display: inline-block; 
            padding: 8px 20px; 
            background-color: #4CAF50; 
            color: white; 
            border-radius: 5px; 
            text-decoration: none;
            font-weight: bold;
            font-size: 15px;
            transition: all 0.3s;
            font-family: sans-serif;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);"
     onmouseover="this.style.backgroundColor='#45a049'; this.style.transform='translateY(-2px)'; this.style.boxShadow='0 4px 8px rgba(0,0,0,0.15)'"
     onmouseout="this.style.backgroundColor='#4CAF50'; this.style.transform='translateY(0)'; this.style.boxShadow='0 2px 5px rgba(0,0,0,0.1)'">
    About Us
  </a>
  <br>
  <br>
  <div style="text-align: center; margin-bottom: 20px;">
  <a href="download.html" 
     style="display: inline-block; 
            padding: 8px 20px; 
            background-color: #4CAF50; 
            color: white; 
            border-radius: 5px; 
            text-decoration: none;
            font-weight: bold;
            font-size: 15px;
            transition: all 0.3s;
            font-family: sans-serif;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);"
     onmouseover="this.style.backgroundColor='#45a049'; this.style.transform='translateY(-2px)'; this.style.boxShadow='0 4px 8px rgba(0,0,0,0.15)'"
     onmouseout="this.style.backgroundColor='#4CAF50'; this.style.transform='translateY(0)'; this.style.boxShadow='0 2px 5px rgba(0,0,0,0.1)'">
    Download UsToss™ App
  </a>
</div>
    <div class="container">
        <button id="toss-button">Toss the Coin</button>
        <div id="coin-container">
            <img id="coin" alt="Coin">
        </div>
        <div id="result"></div>
    </div>



<script>
document.addEventListener('DOMContentLoaded', function() {
    const tossButton = document.getElementById('toss-button');
    const coin = document.getElementById('coin');
    const resultDiv = document.getElementById('result');
    const homeIcon = document.querySelector('.home-icon');
    
    let cheatMode = false;
    let lastClickTime = 0;
    let clickCount = 0;
    
    const spinningGifs = ['giphy.gif'];
    const headsImage = 'heads.jpg';
    const tailsImage = 'tails.jpg';
    
    
    homeIcon.addEventListener('click', function() {
        const now = Date.now();
        
        
        if (now - lastClickTime > 300) {
            clickCount = 0;
        }
        
        clickCount++;
        lastClickTime = now;
        
        
        if (clickCount === 3) {
            cheatMode = true;
            tossButton.style.backgroundColor = 'pink';
            clickCount = 0;
            return;
        }
        
        
        if (clickCount === 2 && cheatMode) {
            cheatMode = false;
            tossButton.style.backgroundColor = '';
            clickCount = 0;
        }
    });
    
    
    tossButton.addEventListener('click', function() {
        tossButton.disabled = true;
        resultDiv.textContent = '';
        coin.style.display = 'block';
        coin.src = spinningGifs[Math.floor(Math.random() * spinningGifs.length)];
        
        setTimeout(function() {
            const result = cheatMode ? 'Tails' : (Math.random() < 0.5 ? 'Heads' : 'Tails');
            resultDiv.textContent = `Result: ${result}!`;
            coin.src = result === 'Heads' ? headsImage : tailsImage;
            tossButton.disabled = false;
        }, 6899);
    });
});
      
    </script>
</body>
</html>
